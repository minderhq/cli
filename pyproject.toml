[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minder-cli"
version = "0.1.0"
description = "Command-line client for a Minder instance's api-gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "minderhq" }]
dependencies = ["httpx>=0.28.1"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "black>=26.5.1", "flake8>=7.4.1", "mypy>=2.3.1"]

[project.scripts]
minder = "minder_cli.cli:main"

[tool.setuptools.packages.find]
include = ["minder_cli*"]

[tool.black]
line-length = 88

[tool.mypy]
ignore_missing_imports = true
