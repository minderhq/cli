[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minder-cli"
version = "0.1.0"
description = "Command-line client for a Minder instance's api-gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "minderhq" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "flake8>=7", "mypy>=1.8"]

[project.scripts]
minder = "minder_cli.cli:main"

[tool.setuptools.packages.find]
include = ["minder_cli*"]

[tool.black]
line-length = 88

[tool.mypy]
ignore_missing_imports = true
