name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          black --check .
          flake8 --max-line-length=100 --extend-ignore=E203,W503 minder_cli tests
      - name: Types
        run: mypy minder_cli
      - name: Tests
        run: pytest -q
