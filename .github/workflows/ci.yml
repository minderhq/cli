name: CI

on:
  push:
    branches: [main]
    paths-ignore: [ '**/*.md' ]
  pull_request:
    paths-ignore: [ '**/*.md' ]

# Cancel a superseded run of THIS workflow on the same ref -- a new push to a
# PR branch, or a newer merge to main, cancels the older in-flight/queued run
# instead of piling a redundant one onto the org's constrained self-hosted pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Shared lint -> type-check -> test pipeline (always GitHub-hosted):
    # minderhq/.github/.github/workflows/python-ci.yml. Repo-specific checks
    # that need the installed environment are passed in below.
    uses: minderhq/.github/.github/workflows/python-ci.yml@main
    with:
      python-versions: '["3.11", "3.12"]'
      lint-paths: minder_cli tests
      mypy-paths: minder_cli
